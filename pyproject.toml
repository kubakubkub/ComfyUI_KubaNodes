[project]
name = "comfyui-kubanodes"
description = "kubakub nodes: a visual toolset for pictures made of parts (projection mapping, previz, music visuals, stills). Regions from mask PNGs, vector files, object IDs, cryptomatte or the 3D model, region-wise diffusion, the kubakub director (layers, lights, keys, video, sound), the kubakub timeline and delivery export."
version = "0.7.0"
license = { file = "LICENSE" }                    # GPL-3.0, as ComfyUI
requires-python = ">=3.10"
classifiers = [
    "Operating System :: Microsoft :: Windows",   # built and tested on Windows 11 only
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = ["opencv-python-headless>=4.8"]    # keep in step with requirements.txt

[project.urls]
Repository = "https://github.com/kubakubkub/ComfyUI_KubaNodes"
Documentation = "https://github.com/kubakubkub/ComfyUI_KubaNodes#documentation"
Changelog = "https://github.com/kubakubkub/ComfyUI_KubaNodes/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/kubakubkub/ComfyUI_KubaNodes/issues"

[tool.comfy]
PublisherId = "kubakub"
DisplayName = "kubakub nodes"
Icon = "https://raw.githubusercontent.com/kubakubkub/ComfyUI_KubaNodes/main/docs/images/icon.png"   # 400x400, the registry allows up to 800x400
includes = []
"requires-comfyui" = ">=0.37.0"                   # keep in step with kub_env.MIN_COMFYUI and README "Requirements"
